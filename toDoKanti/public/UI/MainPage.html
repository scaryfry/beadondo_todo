<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./pagestyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>ToDo</title>
  </head>

  <body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          ✓ MyToDoApp
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" 
                data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto">

            <li class="nav-item">
              <a class="nav-link active" href="#">Feladatok</a>
            </li>

            <li class="nav-item">
              <button class="btn btn-danger ms-3" onclick="logout()">
                Kijelentkezés
              </button>
            </li>

          </ul>
        </div>
      </div>
    </nav>

    <div class="container mt-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="fw-bold">Teendők listája</h1>

        <button class="btn btn-success shadow" data-bs-toggle="modal" data-bs-target="#addTaskModal">
          + Új feladat
        </button>
      </div>

      <div class="card shadow border-0">
        <div class="card-body p-4">

          <table class="table table-hover align-middle">
            <thead class="table-primary">
              <tr>
                <th>Cím</th>
                <th>Leírás</th>
                <th>Státusz</th>
                <th>Határidő</th>
                <th class="text-center">Műveletek</th>
              </tr>
            </thead>
            <tbody id="task-table-body"></tbody>
          </table>

        </div>
      </div>
    </div>

    <div class="modal fade" id="addTaskModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">

          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title">Új feladat hozzáadása</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">

            <div class="mb-3">
              <label class="form-label">Cím</label>
              <input type="text" id="titleInput" class="form-control">
            </div>

            <div class="mb-3">
              <label class="form-label">Leírás</label>
              <textarea id="descriptionInput" class="form-control" rows="3"></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Határidő</label>
              <input type="date" id="deadlineInput" class="form-control">
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="statusInput">
              <label class="form-check-label">Kész?</label>
            </div>

          </div>

          <div class="modal-footer">
            <button class="btn btn-secondary" data-bs-dismiss="modal">Mégse</button>
            <button class="btn btn-primary" onclick="AddTask()">Hozzáadás</button>
          </div>

        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="todo.js"></script>
  </body>
</html>
